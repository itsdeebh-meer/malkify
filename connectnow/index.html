<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ConnectNow</title><style>*{box-sizing:border-box}body{font:16px/1.5 Inter,system-ui;background:radial-gradient(ellipse at 80% 0%,#dce8ff,#f1f4fa 50%);margin:0;color:#1a2943;padding:24px}.app{max-width:760px;margin:24px auto;background:white;padding:26px;border:1px solid #e0e7f2;border-radius:22px;box-shadow:0 20px 55px #24395b18}h1{font-size:32px;letter-spacing:-.04em}input{padding:12px;border:1px solid #ccd6e5;border-radius:10px;margin:4px 5px 12px 0}button{padding:12px 17px;background:#345ee8;color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer}#messages{height:360px;overflow:auto;background:#f4f7fc;padding:14px;border:1px solid #e5eaf3;border-radius:14px}.msg{background:#e5edff;padding:10px 13px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1;min-width:0}.app>input{max-width:48%}details{margin-top:18px;color:#65738b}@media(max-width:560px){body{padding:10px}.app{padding:18px}.app>input{max-width:100%;width:100%}.row{flex-direction:column}}</style><div class=app><h1>💬 ConnectNow</h1><p>Realtime room chat with Firebase.</p><input id=name placeholder="Display name"><input id=room value="lobby"><p id=state>Firebase configuration required.</p><div id=messages></div><form id=form class=row><input id=text placeholder="Message…" required><button>Send</button></form><details><summary>Setup</summary><p>Create Firebase project, enable anonymous Authentication and Realtime Database. Replace config placeholders in source. Configure secure database rules before use.</p></details></div><script type=module>
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,push,onChildAdded,query,limitToLast}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const cfg={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',databaseURL:'https://YOUR_PROJECT-default-rtdb.firebaseio.com',projectId:'YOUR_PROJECT',appId:'YOUR_APP_ID'};let db,uid,sub;
if(!Object.values(cfg).some(x=>x.startsWith('YOUR_'))){try{const app=initializeApp(cfg),a=getAuth(app);db=getDatabase(app);uid=(await signInAnonymously(a)).user.uid;state.textContent='Connected';}catch(e){state.textContent='Firebase error: '+e.message;}}else state.textContent='Paste your Firebase web config to connect.';
function roomKey(){return room.value.trim().replace(/[^\\w-]/g,'').slice(0,40)||'lobby';}\nfunction connect(){if(!db)return;if(sub)sub();messages.innerHTML='';const r=query(ref(db,'rooms/'+roomKey()),limitToLast(100));>
