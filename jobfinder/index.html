<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>JobFinder</title><style>*{box-sizing:border-box}body{font:16px/1.6 Inter,system-ui;background:#f4f6fb;color:#17243d;margin:0}header{background:linear-gradient(120deg,#101e37,#29466e);color:white;padding:30px max(20px,calc((100% - 900px)/2))}header h1{font-size:36px;margin:0}main{max-width:900px;margin:28px auto;padding:0 18px}input,select{padding:12px;border:1px solid #ccd5e4;border-radius:10px;background:white;margin:0 8px 14px 0}.card{background:white;padding:20px;border:1px solid #e2e7f0;border-radius:16px;margin:14px 0;box-shadow:0 7px 20px #20365a0a}.card h3{margin:0 0 4px}button{background:#355ce8;color:white;padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer}#saved{padding:16px;background:white;border-radius:14px}@media(max-width:560px)input,select{width:100%}</style><header><h1>💼 JobFinder</h1><p>Search demo vacancies and track applications.</p></header><main><input id=q placeholder="Search jobs" oninput=render()><select id=kind onchange=render()><option value="">All types</option><option>Full-time</option><option>Internship</option><option>Remote</option></select><div id=list></div><h2>Tracked applications</h2><div class=card id=saved></div></main><script>const jobs=[['Junior Web Developer','Pixel Labs','Lahore','Full-time','HTML CSS JavaScript'],['Flutter Intern','AppForge','Remote','Internship','Dart Flutter'],['Python Developer','DataNest','Karachi','Full-time','Python Flask SQL'],['Frontend Intern','BrightWeb','Islamabad','Internship','JavaScript'],['QA Engineer','QualityWorks','Remote','Remote','Testing APIs']];let apps=JSON.parse(localStorage.jobapps||'[]');function render(){list.innerHTML=jobs.filter(j=>(!kind.value||j[3]===kind.value)&&j.join(' ').toLowerCase().includes(q.value.toLowerCase())).map(j=>'<article class=card><h3>'+j[0]+'</h3><p>'+j[1]+' · '+j[2]+' · '+j[3]+'</p><p>Skills: '+j[4]+'</p><button onclick="track(\''+j[0]+'\')">Track application</button></article>').join('')||'No matches';saved.innerHTML=apps.map(x=>'<p>'+x+' <button onclick="removeApp(\''+x+'\')">Remove</button></p>').join('')||'None yet'}function track(x){if(!apps.includes(x))apps.push(x);save()}function removeApp(x){apps=apps.filter(a=>a!==x);save()}function save(){localStorage.jobapps=JSON.stringify(apps);render()}render();</script>
