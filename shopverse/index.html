<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopVerse — Demo Store</title>
<style>:root{font-family:Inter,system-ui;color:#17233c;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#111d36,#263d68);color:white;padding:25px max(22px,calc((100% - 1100px)/2));box-shadow:0 8px 28px #16284a22}header h2{margin:0}main{max-width:1100px;margin:34px auto;padding:0 22px}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:white;padding:20px;border:1px solid #e3e8f2;border-radius:18px;box-shadow:0 8px 24px #23365b0a}.pic{font-size:52px;background:#f0f4ff;text-align:center;padding:24px;border-radius:13px}button{padding:11px 16px;background:#355ce8;color:white;border:0;border-radius:10px;cursor:pointer;font-weight:700}input{padding:12px;border:1px solid #cbd4e4;border-radius:10px;min-width:230px;margin-bottom:18px}section.card{margin-top:24px}small{opacity:.75}@media(max-width:560px){main{margin:22px auto}input{width:100%}}</style></head>
<body><header><h2>🛍 ShopVerse <small id="count">Cart: 0</small></h2></header><main><h1>Discover products</h1><input id="q" placeholder="Search products" oninput="render()"><div class="grid" id="grid"></div><section class="card"><h2>Your cart</h2><div id="cart">Cart is empty.</div><button onclick="checkout()">Checkout</button><p id="msg" aria-live="polite"></p></section></main>
<script>
const products=[['Headphones','🎧',49],['Smart watch','⌚',79],['Camera','📷',129],['Backpack','🎒',35],['Lamp','💡',22],['Sneakers','👟',64]];
let basket={};try{basket=JSON.parse(localStorage.getItem('basket')||'{}')||{}}catch{basket={}}
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count'),cart=document.getElementById('cart'),msg=document.getElementById('msg');
function render(){grid.innerHTML=products.filter(p=>p[0].toLowerCase().includes(q.value.toLowerCase())).map(p=>'<article class="card"><div class="pic">'+p[1]+'</div><h3>'+p[0]+'</h3><b>$'+p[2]+'</b><p><button onclick="add(\''+p[0]+'\')">Add to cart</button></p></article>').join('');const n=Object.values(basket).reduce((a,b)=>a+b,0);count.textContent='Cart: '+n;cart.innerHTML=Object.entries(basket).map(([k,v])=>'<p>'+k+' × '+v+' <button onclick="del(\''+k+'\')">Remove</button></p>').join('')||'Cart is empty.'}
function add(k){basket[k]=(basket[k]||0)+1;save()}function del(k){delete basket[k];save()}function save(){localStorage.setItem('basket',JSON.stringify(basket));render()}
function checkout(){if(!Object.keys(basket).length){msg.textContent='Add products before checkout.';return}const total=products.reduce((sum,p)=>sum+p[2]*(basket[p[0]]||0),0);const order={id:'SV-'+Date.now(),items:{...basket},total,createdAt:new Date().toISOString()};let orders=[];try{orders=JSON.parse(localStorage.getItem('orders')||'[]')||[]}catch{}orders.unshift(order);localStorage.setItem('orders',JSON.stringify(orders));basket={};save();msg.textContent='Demo order '+order.id+' placed. Total: $'+total.toFixed(2)+'. No payment was charged.'}
render();
</script></body></html>
