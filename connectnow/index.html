<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ConnectNow</title><style>body{font:16px system-ui;background:#edf2f7}.app{max-width:720px;margin:30px auto;background:white;padding:22px;border-radius:15px}input{padding:11px;border:1px solid #ccd4df;border-radius:8px}button{padding:11px;background:#315ee8;color:white;border:0;border-radius:8px}#messages{height:330px;overflow:auto;background:#f4f6fa;padding:12px}.msg{background:#e7efff;padding:8px;margin:7px 0;border-radius:8px}.row{display:flex;gap:8px}.row input{flex:1}</style><div class=app><h1>💬 ConnectNow</h1><p>Realtime room chat with Firebase.</p><input id=name placeholder="Display name"><input id=room value="lobby"><p id=state>Firebase configuration required.</p><div id=messages></div><form id=form class=row><input id=text placeholder="Message…" required><button>Send</button></form><details><summary>Setup</summary><p>Create Firebase project, enable anonymous Authentication and Realtime Database. Replace config placeholders in source. Configure secure database rules before use.</p></details></div><script type=module>
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,push,onChildAdded,query,limitToLast}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const cfg={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',databaseURL:'https://YOUR_PROJECT-default-rtdb.firebaseio.com',projectId:'YOUR_PROJECT',appId:'YOUR_APP_ID'};let db,uid,sub;
if(!Object.values(cfg).some(x=>x.startsWith('YOUR_'))){try{const app=initializeApp(cfg),a=getAuth(app);db=getDatabase(app);uid=(await signInAnonymously(a)).user.uid;state.textContent='Connected';}catch(e){state.textContent='Firebase error: '+e.message;}}else state.textContent='Paste your Firebase web config to connect.';
function connect(){if(!db)return;if(sub)sub();messages.innerHTML='';const r=query(ref(db,'rooms/'+room.value.trim().replace(/[^\w-]/g,'')),limitToLast(100));sub=onChildAdded(r,s=>{const m=s.val(),el=document.createElement('div');el.className='msg';el.textContent=(m.name||'Guest')+': '+(m.text||'');messages.append(el);messages.scrollTop=messages.scrollHeight;});}
room.onchange=connect;form.onsubmit=async e=>{e.preventDefault();if(!db||!uid){state.textContent='Configure Firebase first';return;}const v=text.value.trim();if(v){await push(ref(db,'rooms/'+room.value.trim()),{uid,name:name.value.trim().slice(0,40)||'Guest',text:v.slice(0,1000),createdAt:Date.now()});text.value='';}};connect();
</script>
