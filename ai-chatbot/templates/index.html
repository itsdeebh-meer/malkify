<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malkify AI</title><style>body{font:16px system-ui;background:#101827;color:#eef4ff;max-width:720px;margin:8vh auto;padding:20px}.panel{background:#1b2940;padding:24px;border-radius:18px}textarea{width:100%;min-height:100px;padding:12px;box-sizing:border-box}button{padding:12px;margin-top:10px}#reply{white-space:pre-wrap}</style></head><body><main class="panel"><h1>Malkify AI</h1><form id="f"><textarea id="m" maxlength="4000" placeholder="Ask something…" required></textarea><button>Send</button></form><p id="s"></p><div id="reply"></div></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#s'),reply=document.querySelector('#reply');s.textContent='Thinking…';reply.textContent='';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.querySelector('#m').value})});const d=await r.json();if(!r.ok)throw Error(d.error);reply.textContent=d.reply;s.textContent='';}catch(x){s.textContent=x.message;}};</script></body></html>
