<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>LearnHub</title><style>body{font:16px system-ui;background:#f2f5fa;margin:0;color:#1b2b42}header{padding:22px;background:#172842;color:white}main{max-width:820px;margin:24px auto;padding:0 16px}.card{background:white;padding:20px;border-radius:13px;margin:12px 0}button{background:#315ee8;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}</style><header><h1>🎓 LearnHub</h1><p>Short lessons and quick quizzes.</p></header><main><div id=course></div><div class=card id=progress></div></main><script>const lessons=[['HTML Foundations','HTML structures pages with semantic elements such as header, main, section and footer.','What does HTML define?',['Page structure','Database queries','Image editing'],0],['CSS Basics','CSS controls layout, spacing, colour, typography and responsive design.','Which language styles a page?',['SQL','CSS','Python'],1],['JavaScript','JavaScript adds browser behaviour, handles events and updates page content.','Which language adds interactivity?',['JavaScript','HTML only','Markdown'],0]];let done=JSON.parse(localStorage.learnhub||'[]'),i=0;function show(){let l=lessons[i];course.innerHTML='<article class=card><p>Lesson '+(i+1)+' / '+lessons.length+'</p><h2>'+l[0]+'</h2><p>'+l[1]+'</p><h3>'+l[2]+'</h3>'+l[3].map((x,n)=>'<p><label><input type=radio name=a value='+n+'> '+x+'</label></p>').join('')+'<button onclick=check()>Check answer</button> <button onclick=next()>Next</button><p id=feedback></p></article>';progress.textContent=done.length+' of '+lessons.length+' lessons passed.'}function check(){let a=document.querySelector('input[name=a]:checked');if(!a){feedback.textContent='Select an answer.';return}if(+a.value===lessons[i][4]){if(!done.includes(i))done.push(i);localStorage.learnhub=JSON.stringify(done);feedback.textContent='Correct!'}else feedback.textContent='Try again after reviewing the lesson.';progress.textContent=done.length+' of '+lessons.length+' lessons passed.'}function next(){i=(i+1)%lessons.length;show()}show();</script>
