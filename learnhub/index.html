<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>LearnHub</title><style>*{box-sizing:border-box}body{font:16px/1.65 Inter,system-ui;background:#f4f6fb;margin:0;color:#192942}header{padding:26px max(20px,calc((100% - 850px)/2));background:linear-gradient(120deg,#13233d,#2a5670);color:white}header h1{margin:0;font-size:34px}main{max-width:850px;margin:28px auto;padding:0 18px}.card{background:white;padding:24px;border:1px solid #e3e8f0;border-radius:18px;margin:14px 0;box-shadow:0 8px 24px #23365b0a}button{background:#246b9c;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}input{accent-color:#246b9c}label{cursor:pointer}</style><header><h1>🎓 LearnHub</h1><p>Short lessons and quick quizzes.</p></header><main><div id=course></div><div class=card id=progress></div></main><script>const lessons=[['HTML Foundations','HTML structures pages with semantic elements such as header, main, section and footer.','What does HTML define?',['Page structure','Database queries','Image editing'],0],['CSS Basics','CSS controls layout, spacing, colour, typography and responsive design.','Which language styles a page?',['SQL','CSS','Python'],1],['JavaScript','JavaScript adds browser behaviour, handles events and updates page content.','Which language adds interactivity?',['JavaScript','HTML only','Markdown'],0]];let done=JSON.parse(localStorage.learnhub||'[]'),i=0;function show(){let l=lessons[i];course.innerHTML='<article class=card><p>Lesson '+(i+1)+' / '+lessons.length+'</p><h2>'+l[0]+'</h2><p>'+l[1]+'</p><h3>'+l[2]+'</h3>'+l[3].map((x,n)=>'<p><label><input type=radio name=a value='+n+'> '+x+'</label></p>').join('')+'<button onclick=check()>Check answer</button> <button onclick=next()>Next</button><p id=feedback></p></article>';progress.textContent=done.length+' of '+lessons.length+' lessons passed.'}function check(){let a=document.querySelector('input[name=a]:checked');if(!a){feedback.textContent='Select an answer.';return}if(+a.value===lessons[i][4]){if(!done.includes(i))done.push(i);localStorage.learnhub=JSON.stringify(done);feedback.textContent='Correct!'}else feedback.textContent='Try again after reviewing the lesson.';progress.textContent=done.length+' of '+lessons.length+' lessons passed.'}function next(){i=(i+1)%lessons.length;show()}show();</script>
