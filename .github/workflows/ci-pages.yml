name: Portfolio CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax and app smoke checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [smartcv, linkify, deniai-studio, medibook, ai-chatbot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q ${{ matrix.app }}
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ matrix.app }}/requirements.txt" ]; then pip install -r "${{ matrix.app }}/requirements.txt"; fi
      - name: Flask application import smoke test
        env:
          GEMINI_API_KEY: test-placeholder
        run: |
          APP="${{ matrix.app }}" python - <<'PY'
          import importlib.util, os, pathlib
          root = pathlib.Path(os.environ["APP"])
          target = root / "app.py"
          if target.exists():
              spec = importlib.util.spec_from_file_location("candidate_app", target)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              if hasattr(module, "app"):
                  module.app.testing = True
                  client = module.app.test_client()
                  response = client.get("/")
                  assert response.status_code < 500, response.status_code
          PY

  flutter-checks:
    name: Flutter analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [expensex, movie-platform, task-manager]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze --no-pub

  static-checks:
    name: Static web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML files
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Checker(HTMLParser):
              pass
          files = list(Path(".").glob("**/*.html"))
          assert files, "No HTML files found"
          for file in files:
              Checker().feed(file.read_text(encoding="utf-8"))
              print("HTML parsed:", file)
          PY
      - name: Validate JavaScript syntax
        run: |
          if command -v node >/dev/null; then
            find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -r -n1 node --check
          else
            echo "Node.js unavailable; skipping JavaScript syntax check"
          fi

  deploy-pages:
    name: Publish static portfolio and web demos
    needs: [python-checks, flutter-checks, static-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
