<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>JobFinder</title><style>body{font:16px system-ui;background:#f2f5fa;color:#192940;margin:0}header{background:#162943;color:white;padding:22px}main{max-width:850px;margin:22px auto;padding:0 16px}.card{background:white;padding:17px;border-radius:12px;margin:12px 0}input,select{padding:10px;border:1px solid #ccd4df;border-radius:8px}button{background:#315ee8;color:white;padding:10px;border:0;border-radius:8px}</style><header><h1>💼 JobFinder</h1><p>Search demo vacancies and track applications.</p></header><main><input id=q placeholder="Search jobs" oninput=render()><select id=kind onchange=render()><option value="">All types</option><option>Full-time</option><option>Internship</option><option>Remote</option></select><div id=list></div><h2>Tracked applications</h2><div class=card id=saved></div></main><script>const jobs=[['Junior Web Developer','Pixel Labs','Lahore','Full-time','HTML CSS JavaScript'],['Flutter Intern','AppForge','Remote','Internship','Dart Flutter'],['Python Developer','DataNest','Karachi','Full-time','Python Flask SQL'],['Frontend Intern','BrightWeb','Islamabad','Internship','JavaScript'],['QA Engineer','QualityWorks','Remote','Remote','Testing APIs']];let apps=JSON.parse(localStorage.jobapps||'[]');function render(){list.innerHTML=jobs.filter(j=>(!kind.value||j[3]===kind.value)&&j.join(' ').toLowerCase().includes(q.value.toLowerCase())).map(j=>'<article class=card><h3>'+j[0]+'</h3><p>'+j[1]+' · '+j[2]+' · '+j[3]+'</p><p>Skills: '+j[4]+'</p><button onclick="track(\''+j[0]+'\')">Track application</button></article>').join('')||'No matches';saved.innerHTML=apps.map(x=>'<p>'+x+' <button onclick="removeApp(\''+x+'\')">Remove</button></p>').join('')||'None yet'}function track(x){if(!apps.includes(x))apps.push(x);save()}function removeApp(x){apps=apps.filter(a=>a!==x);save()}function save(){localStorage.jobapps=JSON.stringify(apps);render()}render();</script>
