<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopVerse</title><style>body{font:16px system-ui;background:#f3f5fa;margin:0;color:#18243a}header{background:#172842;color:white;padding:20px}main{max-width:1000px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:14px}.pic{font-size:48px;background:#edf1f8;text-align:center;padding:20px}button{padding:10px 14px;background:#315ee8;color:white;border:0;border-radius:8px;cursor:pointer}input{padding:10px;border:1px solid #ccd4e0;border-radius:8px}</style><header><h2>🛍 ShopVerse <small id="count"></small></h2></header><main><h1>Discover products</h1><input id="q" placeholder="Search" oninput="render()"><div class="grid" id="grid"></div><section class="card"><h2>Your cart</h2><div id="cart"></div><button onclick="checkout()">Checkout</button><p id="msg"></p></section></main><script>const products=[['Headphones','🎧',49],['Smart watch','⌚',79],['Camera','📷',129],['Backpack','🎒',35],['Lamp','💡',22],['Sneakers','👟',64]];let basket=JSON.parse(localStorage.basket||'{}');function render(){grid.innerHTML=products.filter(p=>p[0].toLowerCase().includes(q.value.toLowerCase())).map(p=>'<article class=card><div class=pic>'+p[1]+'</div><h3>'+p[0]+'</h3><b>$'+p[2]+'</b><p><button onclick="add(\''+p[0]+'\')">Add to cart</button></p></article>').join('');let n=Object.values(basket).reduce((a,b)=>a+b,0);count.textContent='Cart: '+n;cart.innerHTML=Object.entries(basket).map(([k,v])=>'<p>'+k+' × '+v+' <button onclick="del(\''+k+'\')">Remove</button></p>').join('')||'Cart is empty.'}function add(k){basket[k]=(basket[k]||0)+1;save()}function del(k){delete basket[k];save()}function save(){localStorage.basket=JSON.stringify(basket);render()}function checkout(){msg.textContent='Demo only: connect a secure backend and payment provider to accept orders.'}render();</script>
